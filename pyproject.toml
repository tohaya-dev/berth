[tool.pyright]
# Stage-3-E: agent.py は既に存在しない（cynovela_agent.py に置換済み）ため include から除外
include = ["server.py", "db.py", "rag.py", "chunker.py", "cynovela_agent.py", "config.py"]
exclude = ["tests/", "data/", "frontend/", "reports/"]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportGeneralTypeIssues = "warning"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --reruns 0 -rR"
xfail_strict = true
# FIX-132: pytest-anyio を auto mode で導入。`pytestmark = pytest.mark.anyio`
# を付けたモジュールの async test を anyio が自動収集する。
anyio_mode = "auto"
markers = [
    "live: tests requiring live server (--demo mode)",
    "slow: tests that include real LLM round trips (require loaded LM Studio model)",
    "schemathesis: auto-generated API tests",
    "no_lm_studio: tests that don't need LM Studio (run regardless of model load state)",
]
# Stage-D #6: hypothesis の .example() 直接呼びによる
# NonInteractiveExampleWarning を抑止する。tests/fixtures/test_fixtures_smoke.py
# 内に残存する .example() コールが warning=error と衝突しないように。
filterwarnings = [
    "ignore::hypothesis.errors.NonInteractiveExampleWarning",
]

[project]
name = "cynovela-v13-verify"
version = "0.0.0"
description = "Cynovela v13 verification project (internal)"
requires-python = ">=3.12"  # fixall-B2 20260602: environment.yml が python=3.12.13 を固定。検証runtimeは3.12系

[project.optional-dependencies]
test = [
    "freezegun>=1.4.0",
    "hypothesis>=6.100.0",
    "opentelemetry-sdk>=1.25.0",
    "schemathesis>=4.0",
    "syrupy>=5.0",
    "pytest-rerunfailures>=14.0",
]
