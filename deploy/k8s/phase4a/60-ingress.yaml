# Phase 4a (k3d load): Ingress（traefik 経由でログイン画面/API へ到達）。
#   k3d クラスタ作成時に host:8900 -> serverlb:80 -> traefik(:80) を配線済み。
#   よって Mac から http://127.0.0.1:8900/ が Ingress 経由で cynovela-svc:8765 に届く。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cynovela-ingress
  namespace: cynovela
  labels: { app: cynovela }
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cynovela-svc
                port:
                  number: 8765
